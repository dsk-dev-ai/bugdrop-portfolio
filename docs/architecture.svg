<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-label="BUG DROP architecture diagram">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#9fb3c8"/>
    </marker>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16324a"/>
      <stop offset="100%" stop-color="#141b26"/>
    </linearGradient>
  </defs>
  <rect width="1100" height="620" fill="#0b0f14"/>
  <g font-family="Inter, system-ui, sans-serif" fill="#e6edf3">
    <text x="40" y="52" font-size="26" font-weight="700">BUG DROP — AWS architecture</text>
    <text x="40" y="82" font-size="15" fill="#9fb3c8">Static portfolio on Amplify Hosting + optional serverless counter</text>

    <rect x="60" y="140" width="220" height="90" rx="14" fill="url(#box)" stroke="#2a3a4d" stroke-width="2"/>
    <text x="170" y="180" text-anchor="middle" font-size="17" font-weight="600">Visitor</text>
    <text x="170" y="205" text-anchor="middle" font-size="13" fill="#9fb3c8">desktop / mobile</text>

    <rect x="380" y="130" width="260" height="110" rx="14" fill="url(#box)" stroke="#39ff88" stroke-width="2"/>
    <text x="510" y="170" text-anchor="middle" font-size="17" font-weight="600">AWS Amplify Hosting</text>
    <text x="510" y="195" text-anchor="middle" font-size="13" fill="#9fb3c8">GitHub CI/CD · HTTPS · live URL</text>
    <text x="510" y="216" text-anchor="middle" font-size="13" fill="#9fb3c8">built-in CloudFront CDN</text>

    <rect x="740" y="130" width="290" height="110" rx="14" fill="url(#box)" stroke="#2a3a4d" stroke-width="2"/>
    <text x="885" y="170" text-anchor="middle" font-size="17" font-weight="600">Static site</text>
    <text x="885" y="195" text-anchor="middle" font-size="13" fill="#9fb3c8">HTML · CSS · JavaScript</text>
    <text x="885" y="216" text-anchor="middle" font-size="13" fill="#9fb3c8">capsules.json · machine UI</text>

    <rect x="380" y="330" width="260" height="90" rx="14" fill="url(#box)" stroke="#4d9bff" stroke-width="2"/>
    <text x="510" y="368" text-anchor="middle" font-size="17" font-weight="600">API Gateway (HTTP API)</text>
    <text x="510" y="393" text-anchor="middle" font-size="13" fill="#9fb3c8">/pull · /stats · /daily</text>

    <rect x="740" y="330" width="290" height="90" rx="14" fill="url(#box)" stroke="#4d9bff" stroke-width="2"/>
    <text x="885" y="368" text-anchor="middle" font-size="17" font-weight="600">AWS Lambda (Node.js 24)</text>
    <text x="885" y="393" text-anchor="middle" font-size="13" fill="#9fb3c8">counter · daily superpower</text>

    <rect x="740" y="480" width="290" height="90" rx="14" fill="url(#box)" stroke="#ffb020" stroke-width="2"/>
    <text x="885" y="518" text-anchor="middle" font-size="17" font-weight="600">Amazon DynamoDB</text>
    <text x="885" y="543" text-anchor="middle" font-size="13" fill="#9fb3c8">capsule_stats · GLOBAL count</text>

    <line x1="280" y1="185" x2="375" y2="185" stroke="#9fb3c8" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="640" y1="185" x2="735" y2="185" stroke="#9fb3c8" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="510" y1="240" x2="510" y2="325" stroke="#4d9bff" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="525" y="290" font-size="12" fill="#9fb3c8">fetch() optional</text>
    <line x1="640" y1="375" x2="735" y2="375" stroke="#4d9bff" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="885" y1="420" x2="885" y2="475" stroke="#ffb020" stroke-width="2" marker-end="url(#arrow)"/>

    <text x="60" y="590" font-size="13" fill="#9fb3c8">If the API is offline, the machine falls back to a local count — the creative feature never breaks.</text>
  </g>
</svg>
